<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Aslan Parçası AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .auth-card { background: #151c2c; border: 1px solid #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-aslan { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; font-weight: 600; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #fff; }
        .form-control:focus { background: #0f172a; color: #fff; border-color: #3b82f6; box-shadow: none; }
        p ul { display: none; } /* Django varsayılan şifre uyarılarını sadeleştirir */
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="container" style="max-width: 440px;">
        <div class="auth-card p-4 p-sm-5 text-center">
            <h2 class="fw-bold text-white mb-1">Hesap Oluştur</h2>
            <p class="text-secondary small mb-4">Aslan Parçası AI ekosistemine katılın</p>
            
            <form method="POST" class="text-start">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-secondary small">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-aslan btn-lg w-100 mt-2 mb-3">Hesabı Oluştur</button>
            </form>

            <div class="text-center mt-2">
                <span class="text-secondary small">Zaten hesabın var mı?</span> 
                <a href="{% url 'login' %}" class="text-primary text-decoration-none small fw-bold">Giriş Yap</a>
            </div>
        </div>
    </div>
    <script>
        // Form inputlarına bootstrap sınıfı ekleyelim
        document.querySelectorAll('input').forEach(i => i.classList.add('form-control'));
    </script>
</body>
</html>
